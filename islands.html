<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ON-DO · 섬 선택</title><link rel="stylesheet" href="css/islands.css">
</head>
<body>
<main class="islands-page">
  <header class="islands-head"><span class="brand">ON-DO</span></header>
  <section class="island-selector" aria-labelledby="choiceTitle">
    <p class="eyebrow">ON-DO</p><h1 id="choiceTitle">어느 섬으로 갈까요?</h1><p class="subcopy">두 섬을 둘러보고, 마음이 가는 곳으로 떠나보세요.</p>
    <div class="carousel" aria-live="polite">
      <button id="prev" class="round-arrow" aria-label="이전 섬">‹</button>
      <article id="islandCard" class="island-card"></article>
      <button id="next" class="round-arrow" aria-label="다음 섬">›</button>
    </div>
    <div class="dots" aria-label="섬 선택"><button data-index="0" aria-label="첫 번째 섬"></button><button data-index="1" aria-label="두 번째 섬"></button></div>
  </section>
</main>
<script src="js/islands.js"></script>
</body></html>
