<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ON-DO | 통합섬</title><link rel="stylesheet" href="css/unified-island.css"></head>
<body><main class="unified-island">
  <div id="unified-map" class="unified-map"><div id="unified-world" class="unified-world"><img id="unified-land" alt="통합섬 지도"><div id="unified-pins"></div></div></div>
  <header class="unified-head"><section class="unified-title"><small id="unified-date"></small><h1>통합섬</h1><p>서로 다른 직무의 이웃들과 마음을 나눠요</p></section><button id="unified-profile" class="unified-profile"><img id="unified-avatar" alt=""><span id="unified-nick"></span><b id="unified-badge" hidden>!</b></button></header>
  <section class="unified-search"><form id="unified-search-form"><label for="unified-query">✦ 내 고민과 닮은 이야기 찾기</label><div><input id="unified-query" placeholder="회사·직무의 고민을 자유롭게 적어보세요"><button>찾아보기</button></div></form><div id="unified-filters"><button data-unified-way="" aria-pressed="true">전체</button><button data-unified-way="0">공감해주세요</button><button data-unified-way="1">경험을 나눠주세요</button><button data-unified-way="2">의견을 들려주세요</button></div></section>
  <details id="unified-theme-picker" class="unified-theme"><summary id="unified-theme-current" aria-label="시간대 설정"></summary><div id="unified-themes"></div></details>
  <aside class="unified-feed"><button id="unified-feed-toggle"><span><strong>인기 고민</strong><small>서로의 마음을 살펴보세요</small></span><b>⌄</b></button><div id="unified-feed-list"></div></aside>
  <div class="unified-zoom"><button id="unified-zoom-out">−</button><button id="unified-zoom-reset">100%</button><button id="unified-zoom-in">+</button></div><button id="unified-write" class="unified-write">고민 나누기</button>
</main>
<dialog id="unified-detail"><article id="unified-detail-body"></article></dialog>
<dialog id="unified-editor"><form id="unified-post-form"><header><h2>오늘, 어떤 마음이었나요?</h2><button type="button" data-unified-close="unified-editor">닫기</button></header><p>실명과 회사명은 빼고 편하게 적어주세요.</p><label>고민 분야<select id="unified-topic"><option>업무량·스트레스</option><option>직장 내 관계·갈등</option><option>번아웃·무기력</option><option>커리어 성장·역량</option></select></label><label>제목<input id="unified-post-title" required maxlength="40" placeholder="고민을 한 문장으로 표현해 주세요"></label><label>내용<textarea id="unified-post-body" required maxlength="1000" placeholder="오늘 있었던 일과 마음을 적어보세요."></textarea></label><fieldset><legend>받고 싶은 위로</legend><label><input type="radio" name="unified-way" value="0" checked> 공감해주세요</label><label><input type="radio" name="unified-way" value="1"> 경험을 나눠주세요</label><label><input type="radio" name="unified-way" value="2"> 의견을 들려주세요</label></fieldset><label class="unified-check"><input id="unified-private" type="checkbox"> 나만 보기</label><button class="unified-submit">마음 내려놓기</button></form></dialog>
<dialog id="unified-personal"><section id="unified-personal-body"></section></dialog>
<script src="js/unified-island.js"></script></body></html>
