<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ON-DO · 통합섬</title><link rel="stylesheet" href="css/common.css"></head>
<body><main class="common-island">
<header class="common-head"><a href="islands.html" class="back">← 섬 선택</a><section><p>ON-DO</p><h1>통합섬</h1></section><button id="myProfile" class="my-profile"><img id="myAvatar" alt=""><span id="myNick"></span><b id="alarm">!</b></button></header>
<section class="find-box"><form id="similarForm"><label for="similar">✦ 내 고민과 닮은 이야기 찾기</label><div><input id="similar" type="search" placeholder="내 이야기를 공개하지 않아도 비슷한 경험을 읽을 수 있어요."><button>찾아보기</button></div><div class="keywords"><button type="button">상사와의 관계</button><button type="button">번아웃</button><button type="button">업무 적응</button><button type="button">회의 스트레스</button></div></form></section>
<section id="searchResult" class="search-result" hidden aria-live="polite"></section>
<section class="filter-bar"><span>받고 싶은 위로</span><button data-way="" aria-pressed="true">전체</button><button data-way="EMPATHY">공감해주세요</button><button data-way="SHARE_EXPERIENCE">경험을 나눠주세요</button><button data-way="OPINION">의견을 들려주세요</button><button id="resetFilter" hidden>초기화</button></section>
<section id="map" class="common-map" aria-label="통합섬 지도"><img id="mapImage" src="assets/village/village-day.webp" alt=""><div id="pins"></div><div class="zoom"><button id="zoomOut" aria-label="지도 축소">−</button><button id="zoomReset">100%</button><button id="zoomIn" aria-label="지도 확대">+</button></div><button id="write" class="write">고민 나누기</button></section>
<aside class="recent"><button id="recentToggle"><span><strong>이웃의 마음</strong><small>최근 올라온 고민</small></span><b>⌄</b></button><div id="recentList"></div></aside>
</main>
<dialog id="detail"><article id="detailBody"></article></dialog><dialog id="editor"><form id="postForm"><header><h2>어떤 고민을 나누고 싶나요?</h2><button type="button" data-close="editor">닫기</button></header><label>고민 분야<select id="topic"><option>업무량·스트레스</option><option>직장 내 관계·갈등</option><option>번아웃·무기력</option><option>불안·걱정</option><option>커리어 성장·역량</option></select></label><label>제목 <small>필수 · 40자 이내</small><input id="title" maxlength="40" required placeholder="고민을 한 문장으로 표현해 주세요"></label><label>편하게 고민을 적어주세요.<textarea id="body" maxlength="1000" required placeholder="오늘 있었던 일과 마음을 적어보세요.&#10;&#10;회사명과 실명은 빼고 적어주세요."></textarea></label><fieldset><legend>받고 싶은 위로</legend><label><input type="radio" name="way" value="EMPATHY" checked> 공감해주세요</label><label><input type="radio" name="way" value="SHARE_EXPERIENCE"> 경험을 나눠주세요</label><label><input type="radio" name="way" value="OPINION"> 의견을 들려주세요</label></fieldset><label class="check"><input id="shareYears" type="checkbox"> 연차 정보 공개</label><label class="check"><input id="private" type="checkbox"> 나만 보기</label><p id="editorStatus" aria-live="polite"></p><button class="publish">마음 내려놓기</button></form></dialog>
<dialog id="profileDialog"><div id="profileBody"></div></dialog><dialog id="crisis"><h2>혼자 견디지 않으셔도 괜찮아요.</h2><p>지금 많이 힘드신 것 같아요. 필요한 도움을 바로 받아보세요.</p><a href="tel:109">자살예방상담전화 109 · 24시간</a><a href="tel:1577-0199">정신건강위기상담전화 1577-0199 · 24시간</a><button onclick="this.closest('dialog').close()">확인</button></dialog>
<script src="js/mock-data.js"></script><script src="js/api.js"></script><script src="js/common.js"></script></body></html>
